<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Lax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --coral:#D97757; --ink:#000; --fg:#e8e2d6; --dim:#6b6459; --green:#7CFC9A; --red:#ff5a4f; --amber:#ffc65a; --blue:#7fb8ff; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { background:#000; color:var(--fg); height:100%; overflow:hidden; font-family:'VT323',ui-monospace,monospace; user-select:none; }
  body { display:grid; place-items:center; }
  /* Designed at the Flip 3 cover screen's native 260×512, scaled to fit any screen. */
  #app { width:260px; height:512px; position:relative; transform-origin:center; display:flex; flex-direction:column; background:#000; }
  #top { height:256px; position:relative; flex:none; touch-action:none; }
  #stage { position:absolute; inset:0; width:260px; height:256px; image-rendering:pixelated; }
  #hud { position:absolute; left:6px; right:6px; top:4px; display:flex; align-items:center; gap:6px; font-size:15px; line-height:1; z-index:2; }
  #hud .name { color:var(--coral); letter-spacing:1px; cursor:pointer; padding:2px 3px 2px 0; }
  #hud .name::after { content:' ≡'; color:var(--dim); }
  #xp { flex:1; height:5px; background:#1d1a17; outline:1px solid #2c2824; }
  #xp i { display:block; height:100%; width:0; background:var(--coral); transition:width .4s steps(8); }
  #dots { display:flex; gap:3px; }
  #dots b { width:6px; height:6px; background:var(--dim); }
  #dots b.working { background:var(--blue); animation:blink .5s steps(2) infinite; }
  #dots b.waiting { background:var(--amber); animation:blink .3s steps(2) infinite; }
  #dots b.done { background:var(--green); }
  @keyframes blink { 50% { opacity:.25 } }

  /* Pixel speech bubble */
  #bubble { position:absolute; left:10px; right:12px; top:22px; z-index:3; background:#f4ecdf; color:#14110f; padding:5px 8px 7px;
    font-size:17px; line-height:15px; display:none; border:3px solid #000; box-shadow:4px 4px 0 #2a2521; }
  #bubble.show { display:block; animation:pop .18s steps(3); }
  #bubble::after { content:''; position:absolute; left:calc(50% - 6px); bottom:-9px; width:9px; height:9px; background:inherit;
    border-right:3px solid #000; border-bottom:3px solid #000; transform:rotate(45deg); }
  #bubble.permission { background:#ffe7a8; }
  #bubble.error { background:#ffc9c4; }
  #bubble .tag { font-size:13px; opacity:.6; display:block; margin-bottom:1px; }
  #bubble .text { max-height:62px; overflow:hidden; word-break:break-word; }
  #bubble .actions { display:flex; gap:8px; margin-top:6px; }
  #bubble button { flex:1; font:inherit; font-size:18px; padding:3px 0 4px; border:0; color:#fff; cursor:pointer;
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), 0 0 0 2px #000; }
  #bubble .yes { background:#2f9e57; } #bubble .no { background:#c9392f; }
  #bubble button:active { box-shadow: inset 3px 3px 0 rgba(0,0,0,.35), 0 0 0 2px #000; }
  @keyframes pop { 0% { transform:scale(.6) } 100% { transform:scale(1) } }

  #hint { position:absolute; bottom:4px; width:100%; text-align:center; font-size:13px; color:var(--dim); z-index:2; }

  /* Terminal feed */
  #term { flex:1; border-top:2px solid #1f1c19; padding:5px 6px; font-size:14px; line-height:13px; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; }
  #term div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#b7b0a4; }
  #term .prompt { color:var(--fg); } #term .done { color:var(--green); } #term .error { color:var(--red); }
  #term .session { color:var(--dim); } #term .tool::before { content:''; }
  #term .p { color:var(--coral); }
  #cursor { display:inline-block; width:6px; height:10px; background:var(--green); animation:blink 1s steps(2) infinite; vertical-align:-1px; }

  /* Life menu */
  #life { position:absolute; inset:0; z-index:8; background:#000; overflow-y:auto; padding:8px 10px 16px; font-size:17px; line-height:1.05; display:none; }
  #life.open { display:block; }
  #life header { display:flex; justify-content:space-between; align-items:center; color:var(--coral); font-size:22px; margin-bottom:6px; position:sticky; top:-8px; background:#000; padding:4px 0; }
  #life header button { font:inherit; background:none; border:0; color:var(--fg); font-size:22px; cursor:pointer; padding:0 4px; }
  #life h3 { font-weight:400; color:var(--dim); font-size:15px; margin:10px 0 4px; border-bottom:1px dashed #2c2824; text-transform:uppercase; letter-spacing:1px; }
  #life label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:5px 0; }
  #life input[type=text] { font:inherit; background:#14110f; color:var(--fg); border:2px solid #2c2824; padding:1px 5px; width:120px; }
  #life input[type=range] { width:110px; accent-color:var(--coral); }
  #swatches { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  #swatches button { width:24px; height:24px; border:2px solid #000; outline:2px solid #2c2824; cursor:pointer; }
  #swatches button.on { outline-color:var(--fg); }
  #swatches input { width:28px; height:28px; border:0; background:none; padding:0; }
  .tog { width:34px; height:16px; background:#2c2824; position:relative; cursor:pointer; flex:none; border:0; }
  .tog::after { content:''; position:absolute; left:2px; top:2px; width:12px; height:12px; background:var(--dim); transition:left .1s steps(2); }
  .tog.on { background:var(--coral); } .tog.on::after { left:20px; background:#fff; }
  .seg { display:flex; } .seg button { font:inherit; font-size:15px; background:#14110f; color:var(--dim); border:1px solid #2c2824; padding:1px 6px; cursor:pointer; }
  .seg button.on { background:var(--coral); color:#000; }
  #stats { display:grid; grid-template-columns:1fr 1fr; gap:2px 10px; color:#b7b0a4; }
  #stats b { color:var(--fg); font-weight:400; }
  .bar { display:flex; align-items:center; gap:6px; font-size:15px; color:#b7b0a4; } .bar span:first-child { width:62px; }
  .bar i { height:6px; background:var(--coral); display:block; }
  #miles { list-style:none; color:#b7b0a4; font-size:15px; } #miles li::before { content:'★ '; color:var(--amber); }
  #rebirth { width:100%; font:inherit; margin-top:8px; padding:5px; background:#3a1512; color:#ffb4ad; border:2px solid #c9392f; cursor:pointer; position:relative; overflow:hidden; }
  #rebirth i { position:absolute; left:0; top:0; bottom:0; width:0; background:rgba(255,90,79,.35); }

  /* Open phone (main screen / Flex mode): top half Lax, bottom half terminal — the fold sits on the seam. */
  body.big { display:block; }
  body.big #app { width:100vw; height:100vh; height:100dvh; transform:none !important; }
  body.big #top { height:50%; }
  body.big #stage { inset:auto; }
  body.big #hud { font-size:22px; top:10px; left:14px; right:14px; gap:10px; } body.big #xp { height:8px; } body.big #dots b { width:10px; height:10px; }
  body.big #bubble { font-size:24px; line-height:21px; top:44px; left:18px; right:20px; padding:8px 12px 10px; }
  body.big #bubble .tag { font-size:17px; } body.big #bubble .text { max-height:88px; } body.big #bubble button { font-size:24px; }
  body.big #hint { font-size:18px; bottom:10px; }
  body.big #term { font-size:19px; line-height:18px; padding:10px 14px; }
  body.big #life { font-size:22px; padding:14px 18px; } body.big #life h3 { font-size:18px; } body.big #life header { font-size:28px; }
  #chips { display:none; } body.big #chips { display:flex; gap:8px; flex-wrap:wrap; padding:10px 14px 0; font-size:18px; }
  #chips span { border:2px solid #2c2824; padding:0 6px; color:#b7b0a4; } #chips span::before { content:'■ '; color:var(--dim); }
  #chips .working::before { color:var(--blue); } #chips .waiting::before { color:var(--amber); } #chips .done::before { color:var(--green); }
  #bar { display:none; } body.big #bar { display:flex; gap:10px; padding:10px 14px 14px; }
  #bar button { flex:1; font:inherit; font-size:22px; padding:8px; background:#14110f; color:var(--fg); border:2px solid #2c2824; cursor:pointer; touch-action:none; }
  #bar #talk { flex:2; border-color:var(--coral); color:var(--coral); }
  #bottom { flex:1; display:flex; flex-direction:column; min-height:0; }

  /* Closed phone, held upright: the Flip 3 cover screen is a 512×260 landscape strip → Lax left, bubble + terminal right. */
  body.wide #app { width:512px; height:260px; flex-direction:row; }
  body.wide #top { width:228px; height:260px; }
  body.wide #stage { inset:auto; left:10px; top:44px; width:208px; height:204px; }
  body.wide #bottom { border-left:2px solid #1f1c19; }
  body.wide #term { border-top:0; font-size:15px; line-height:14px; }
  body.wide #bubble { position:relative; left:auto; right:auto; top:auto; margin:10px 12px 4px 14px; flex:none; }
  body.wide #bubble::after { left:-9px; bottom:auto; top:12px; border-right:0; border-left:3px solid #000; }

  /* Question bubble (AskUserQuestion): real options instead of yes/no. */
  #bubble.question { background:#dff1ff; }
  #bubble .choices { display:none; flex-direction:column; gap:4px; margin-top:6px; max-height:170px; overflow-y:auto; }
  #bubble.question .choices { display:flex; }
  #bubble .choices button.opt { font:inherit; font-size:17px; line-height:15px; text-align:left; background:#fff; color:#14110f; border:0; padding:4px 7px 5px;
    box-shadow:0 0 0 2px #000, inset -2px -2px 0 rgba(0,0,0,.15); cursor:pointer; }
  #bubble .choices button.opt small { display:block; font-size:14px; color:#5b544b; line-height:13px; margin-top:1px; }
  #bubble .choices button.opt.on { background:#2f9e57; color:#fff; } #bubble .choices button.opt.on small { color:#d6f5e0; }
  #bubble .choices .row { display:flex; gap:6px; margin-top:2px; }
  #bubble .choices .row button { flex:1; font:inherit; font-size:15px; padding:3px 0; border:0; background:#14110f; color:#e8e2d6; cursor:pointer; box-shadow:0 0 0 2px #000; }
  #bubble .choices .row button.send { background:#2f9e57; color:#fff; }
  #bubble .qstep { float:right; opacity:.6; }
  body.wide #bubble .choices { max-height:120px; } body.wide #bubble.question .text { max-height:32px; }
  body.big #bubble .choices button.opt { font-size:22px; line-height:20px; padding:7px 10px; } body.big #bubble .choices button.opt small { font-size:17px; line-height:16px; }
  body.big #bubble .choices .row button { font-size:20px; padding:6px 0; } body.big #bubble .choices { max-height:340px; }

  #wake { position:fixed; inset:0; z-index:10; background:#000; display:grid; place-items:center; text-align:center; color:var(--coral); font-size:22px; cursor:pointer; }
  #wake small { display:block; color:var(--dim); font-size:15px; margin-top:6px; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <canvas id="stage" width="52" height="51"></canvas>
    <div id="hud"><span class="name" id="nameBtn">LAX</span><span id="lvl">Lv1</span><div id="xp"><i></i></div><div id="dots"></div></div>
    <div id="bubble"><span class="tag"></span><div class="text"></div><div class="choices"></div><div class="actions"><button class="yes">✓ yes</button><button class="no">✗ no</button></div></div>
    <div id="hint">tap Lax to talk</div>
  </div>
  <div id="bottom">
  <div id="chips"></div>
  <div id="term"><div class="session">lax v0.3 — waiting for claude code…</div><div><span id="cursor"></span></div></div>
  <div id="bar"><button id="talk">🎙 tap to talk</button><button id="lifeBtn">♥ life</button></div>
  </div>
  <div id="life">
    <header><span>♥ <span id="lifeName">LAX</span>'s life</span><button id="lifeClose">✕</button></header>
    <h3>who</h3>
    <label>name <input type="text" id="sName" maxlength="12"></label>
    <h3>color</h3>
    <div id="swatches"></div>
    <h3>voice</h3>
    <label>speaks out loud <button class="tog" data-k="voice"></button></label>
    <label>pitch <input type="range" id="sPitch" min="0.5" max="2" step="0.1"></label>
    <label>reads every "done" <button class="tog" data-k="speakDone"></button></label>
    <h3>approvals</h3>
    <label>ask me on the phone <button class="tog" data-k="phoneApprovals"></button></label>
    <label>wait before terminal <span class="seg" id="sWait"><button data-v="15">15s</button><button data-v="30">30s</button><button data-v="60">60s</button><button data-v="120">2m</button></span></label>
    <h3>memory</h3>
    <div id="stats"></div>
    <h3>favorite tools</h3>
    <div id="tools"></div>
    <h3>milestones</h3>
    <ul id="miles"></ul>
    <h3>rebirth</h3>
    <button id="rebirth"><i></i><span>hold 2s to start a new life</span></button>
  </div>
</div>
<div id="wake"><div>tap to wake Lax<small>(unlocks sound + mic)</small></div></div>
<script src="lax.js?v=6"></script>
</body>
</html>
