<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121110">
<link rel="icon" href="/demo/favicon.svg" type="image/svg+xml">
<title>digi-lax demo</title>
<meta name="description" content="Lax: a pixel companion for Claude Code that lives on an old phone.">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  /* The public demo (/demo): the real Lax page in demo mode, inside a Galaxy Z
     Flip 3 drawn at its real proportions and scaled to fit the visitor's screen. Served by server.mjs. */
  :root { --bg:#121110; --fg:#e8e2d6; --dim:#8a8378; --coral:#D97757; --shell:#1b1e21; --edge:#4a4f55; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--fg); font-family:'VT323',ui-monospace,monospace; display:flex; flex-direction:column; align-items:center;
    padding:18px 16px 16px; gap:12px; overflow-x:hidden; }
  header { text-align:center; flex:none; }
  h1 { color:var(--coral); font-weight:400; font-size:34px; line-height:1; }
  .sub { color:var(--dim); font-size:19px; margin-top:4px; max-width:560px; }
  nav { display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
  nav button { font:inherit; background:none; cursor:pointer; color:var(--dim); font-size:20px; border:2px solid #2c2824; padding:2px 12px 3px; }
  nav button.on { color:var(--coral); border-color:var(--coral); }
  #fit { flex:1; min-height:0; width:100%; position:relative; overflow:hidden; }
  /* Out of the flow, so the phone's real size never widens the page; fit() scales it into the box. */
  #device { position:absolute; left:50%; top:50%; transform-origin:center; }
  iframe { border:0; display:block; background:#000; }
  .note { color:var(--dim); font-size:18px; text-align:center; max-width:560px; flex:none; line-height:1.1; }
  .note a { color:var(--fg); text-decoration:none; } .note a:hover { text-decoration:underline; }

  /* Open phone: 6.7" screen, 412 × 982 CSS px, in a thin shell with a punch-hole camera. */
  .open { background:var(--shell); padding:14px; border-radius:46px; box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 0 0 2px var(--edge); position:relative; }
  .open .screen { border-radius:32px; overflow:hidden; position:relative; }
  .open .punch { position:absolute; width:12px; height:12px; border-radius:50%; background:#000; box-shadow:0 0 0 2px #111; z-index:2; }
  .open .crease { position:absolute; background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent); pointer-events:none; }
  .portrait .screen, .portrait iframe { width:412px; height:982px; }
  .portrait .punch { top:30px; left:calc(50% - 6px); } .portrait .crease { left:14px; right:14px; top:50%; height:2px; }
  .landscape .screen, .landscape iframe { width:982px; height:412px; }
  .landscape .punch { left:30px; top:calc(50% - 6px); } .landscape .crease { top:14px; bottom:14px; left:50%; width:2px;
    background:linear-gradient(180deg,transparent,rgba(255,255,255,.07),transparent); }

  /* Closed phone, top half: the 1.9" cover strip (512 × 260), with the two cameras on its right. */
  .cover { background:linear-gradient(160deg,#3a3f44,var(--shell)); padding:22px; border-radius:54px; box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 0 0 2px var(--edge); }
  .cover .glass { background:#050505; border-radius:34px; padding:22px 110px 22px 26px; position:relative; box-shadow:inset 0 0 0 2px #222; }
  .cover .cam { position:absolute; right:26px; width:62px; height:62px; border-radius:50%; background:radial-gradient(circle at 40% 40%,#334 0 20%,#000 45%); box-shadow:0 0 0 5px #1a1a1a, 0 0 0 8px #333; }
  .cover .cam.a { top:46px; } .cover .cam.b { bottom:46px; }
  .cover .screen { border-radius:8px; overflow:hidden; } .cover iframe { width:512px; height:260px; }
</style>
</head>
<body>
<header>
  <h1>Lax</h1>
  <p class="sub">A pixel companion that lives on an old phone.<br>You talk, it answers, and it grows with you.</p>
  <nav><button data-pose="portrait">portrait</button><button data-pose="landscape">landscape</button><button data-pose="cover">cover</button></nav>
</header>
<div id="fit"><div id="device"></div></div>
<p class="note">Tap Lax to talk · <a href="demo/mind">its mind, live</a> · <a href="https://github.com/diogodebastos/lax">github</a></p>
<script>
  const POSES = {
    portrait: { layout: 'big', cls: 'open portrait' },
    landscape: { layout: 'side', cls: 'open landscape' },
    cover: { layout: 'wide', cls: 'cover' },
  };
  const dev = document.querySelector('#device');
  // One page, three poses: the buttons swap the phone (and restart the demo inside it in that layout).
  function show(pose) {
    const p = POSES[pose];
    document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.pose === pose));
    const frame = `<iframe src="/demo/app?demo&awake&layout=${p.layout}" title="Lax" allow="microphone; autoplay"></iframe>`;
    dev.className = p.cls;
    dev.innerHTML = p.cls === 'cover'
      ? `<div class="glass"><div class="cam a"></div><div class="cam b"></div><div class="screen">${frame}</div></div>`
      : `<div class="punch"></div><div class="screen">${frame}</div><div class="crease"></div>`;
    fit();
  }
  document.querySelector('nav').addEventListener('click', (e) => e.target.dataset.pose && show(e.target.dataset.pose));
  // Scale the phone to the space between the header and the note, never above its real size times 1.4.
  function fit() {
    const box = document.querySelector('#fit').getBoundingClientRect();
    const k = Math.min(box.width / dev.offsetWidth, box.height / dev.offsetHeight, 1.4);
    dev.style.transform = `translate(-50%, -50%) scale(${k})`;
  }
  // First pose: portrait on a phone, landscape on a computer, and once in a while (5%) the closed phone.
  const mobile = matchMedia('(pointer: coarse)').matches;
  addEventListener('resize', fit); show(Math.random() < 0.05 ? 'cover' : mobile ? 'portrait' : 'landscape'); document.fonts?.ready.then(fit);
</script>
</body>
</html>
