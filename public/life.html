<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lax · Life</title>
<link rel="icon" href="favicon.svg">
<style>
  :root { --bg:#0d0c0b; --cell:#e8c26a; --grid:#1d1b18; --text:#b7b0a4; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4efe6; --cell:#3a3328; --grid:#e2dbcf; --text:#5a5248; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px ui-monospace, Menlo, monospace; }
  body { display:flex; flex-direction:column; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing:border-box; }
  header, nav { display:flex; gap:6px; align-items:center; padding:8px; flex-wrap:wrap; }
  header a { color:inherit; text-decoration:none; }
  header b { flex:1; }
  canvas { flex:1; width:100%; min-height:0; touch-action:none; image-rendering:pixelated; }
  button, select { background:none; color:inherit; border:1px solid var(--grid); border-radius:6px; padding:8px 10px; font:inherit; }
  button.on { border-color:var(--cell); color:var(--cell); }
</style>
</head>
<body>
<header><a href="/">← lax</a><b>game of life</b><span id="gen">gen 0</span></header>
<canvas id="c"></canvas>
<nav>
  <button id="play" class="on">pause</button>
  <button id="step">step</button>
  <button id="soup">random</button>
  <button id="clear">clear</button>
  <select id="pattern"><option value="">add…</option><option>glider</option><option>lwss</option><option>pulsar</option><option>gun</option></select>
  <button id="speed">1×</button>
</nav>
<script>
// Conway's Game of Life on a wrap-around grid. Tap or drag to draw cells.
const W = 64, H = 96;
let grid = new Uint8Array(W * H), next = new Uint8Array(W * H), gen = 0, running = true, speed = 1;

function step() {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let n = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
      if (dx || dy) n += grid[((y + dy + H) % H) * W + (x + dx + W) % W];
    const i = y * W + x;
    next[i] = n === 3 || (grid[i] && n === 2) ? 1 : 0; // born with 3, survives with 2 or 3
  }
  [grid, next] = [next, grid]; gen++;
}

// Patterns as rows of "#" (alive) and "." (dead).
const PATTERNS = {
  glider: ['.#.', '..#', '###'],
  lwss: ['.#..#', '#....', '#...#', '####.'],
  pulsar: ['..###...###..', '.............', '#....#.#....#', '#....#.#....#', '#....#.#....#', '..###...###..', '.............',
           '..###...###..', '#....#.#....#', '#....#.#....#', '#....#.#....#', '.............', '..###...###..'],
  gun: ['........................#...........', '......................#.#...........', '............##......##............##',
        '...........#...#....##............##', '##........#.....#...##..............', '##........#...#.##....#.#...........',
        '..........#.....#.......#...........', '...........#...#....................', '............##......................'],
};
function place(rows, ox, oy) {
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === '#') grid[((oy + y) % H) * W + (ox + x) % W] = 1; }));
}
function soup() { for (let i = 0; i < grid.length; i++) grid[i] = Math.random() < 0.22 ? 1 : 0; gen = 0; }

const c = document.getElementById('c'), ctx = c.getContext('2d');
let cell = 1, offX = 0, offY = 0;
function fit() {
  const r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr;
  cell = Math.floor(Math.min(c.width / W, c.height / H));
  offX = Math.floor((c.width - cell * W) / 2); offY = Math.floor((c.height - cell * H) / 2);
}
function draw() {
  const css = getComputedStyle(document.documentElement);
  ctx.fillStyle = css.getPropertyValue('--grid'); ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = css.getPropertyValue('--bg'); ctx.fillRect(offX, offY, cell * W, cell * H);
  ctx.fillStyle = css.getPropertyValue('--cell');
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
    if (grid[y * W + x]) ctx.fillRect(offX + x * cell, offY + y * cell, cell - (cell > 3), cell - (cell > 3));
  document.getElementById('gen').textContent = `gen ${gen}`;
}

let last = 0;
function loop(t) {
  if (running && t - last > 120 / speed) { step(); last = t; }
  draw(); requestAnimationFrame(loop);
}

// Drawing: the first cell touched decides whether the drag adds or erases.
let painting = null;
function cellAt(e) {
  const r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  const x = Math.floor(((e.clientX - r.left) * dpr - offX) / cell), y = Math.floor(((e.clientY - r.top) * dpr - offY) / cell);
  return x >= 0 && x < W && y >= 0 && y < H ? y * W + x : -1;
}
c.addEventListener('pointerdown', (e) => { const i = cellAt(e); if (i < 0) return; painting = grid[i] ? 0 : 1; grid[i] = painting; c.setPointerCapture(e.pointerId); });
c.addEventListener('pointermove', (e) => { if (painting === null) return; const i = cellAt(e); if (i >= 0) grid[i] = painting; });
c.addEventListener('pointerup', () => { painting = null; });
c.addEventListener('pointercancel', () => { painting = null; });

const $ = (id) => document.getElementById(id);
$('play').onclick = () => { running = !running; $('play').textContent = running ? 'pause' : 'play'; $('play').classList.toggle('on', running); };
$('step').onclick = () => { step(); };
$('soup').onclick = soup;
$('clear').onclick = () => { grid.fill(0); gen = 0; };
$('pattern').onchange = (e) => { const p = PATTERNS[e.target.value]; if (p) place(p, (W - p[0].length) >> 1, (H - p.length) >> 1); e.target.value = ''; };
$('speed').onclick = () => { speed = speed >= 8 ? 1 : speed * 2; $('speed').textContent = `${speed}×`; };
addEventListener('resize', fit);

// Self-check, in the console: a blinker flips back in 2 generations.
{ const keep = grid.slice(); grid.fill(0); place(['###'], 10, 10); const a = grid.slice(); step(); step();
  console.assert(a.every((v, i) => v === grid[i]), 'life: blinker should repeat every 2 generations'); grid = keep; gen = 0; }

soup(); fit(); requestAnimationFrame(loop);
</script>
</body>
</html>
